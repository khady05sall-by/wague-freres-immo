<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wague & Frères Immo — Plateforme de suivi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#211D17;
  --paper:#F6EFDD;
  --card:#FCF9EF;
  --deep:#0F332F;
  --deep2:#0A2422;
  --gold:#B4863C;
  --goldlight:#D8B876;
  --clay:#C97B3D;
  --muted:#8A8478;
  --line:#E4D9BE;
  --ok-bg:#DCEEDD; --ok-tx:#1E5B1E;
  --warn-bg:#FBE7C6; --warn-tx:#8A5A00;
  --grey-bg:#E3E1DC; --grey-tx:#55524A;
  --yellow-bg:#FFF2CC; --yellow-tx:#8A7315;
  --red-bg:#F6D2CE; --red-tx:#9C2B22;
}
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter', -apple-system, sans-serif;
  padding-bottom:60px;
}
header{
  background:linear-gradient(155deg, var(--deep) 0%, var(--deep2) 100%);
  color:#F3EAD3; padding:28px 20px 34px 20px; position:relative; overflow:hidden;
}
header::before{
  content:""; position:absolute; top:-60px; right:-60px; width:220px; height:220px;
  border-radius:50%; background:rgba(255,255,255,0.05);
}
.brand-row{ display:flex; align-items:center; gap:12px; margin-bottom:14px; position:relative; z-index:1; }
.seal{
  width:44px; height:44px; border-radius:50%; border:1px solid var(--goldlight);
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size:13px; color:var(--goldlight);
  flex-shrink:0;
}
.brand-title{ font-family:'Playfair Display', serif; font-size:20px; font-weight:700; }
.brand-title b{ color:var(--goldlight); font-style:italic; font-weight:600; }
.brand-sub{ font-size:11px; letter-spacing:2px; color:var(--goldlight); text-transform:uppercase; margin-top:2px; }

h1{
  font-family:'Playfair Display', serif; font-size:26px; font-weight:700; margin:6px 0 4px 0; position:relative; z-index:1;
}
header p{ margin:0; font-size:13.5px; color:#CFC5A8; max-width:520px; position:relative; z-index:1; }

.addbtn{
  margin-top:18px; background:var(--gold); color:#1c1804; border:none; padding:11px 20px;
  border-radius:24px; font-weight:700; font-size:13.5px; cursor:pointer; position:relative; z-index:1;
  display:inline-flex; align-items:center; gap:8px;
}
.addbtn:hover{ background:var(--goldlight); }
.adminbtn{ margin-top:18px; margin-left:8px; background:transparent; color:#F3EAD3; border:1px solid var(--goldlight); padding:10px 16px; border-radius:24px; font-weight:700; font-size:13px; cursor:pointer; position:relative; z-index:1; }
.adminbtn:hover{ background:rgba(216,184,118,0.14); }
.admin-state{ color:var(--goldlight); font-size:11px; margin-top:10px; position:relative; z-index:1; }
.admin-panel{ max-width:1000px; margin:14px auto 0; padding:0 20px; }
.admin-panel-inner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--deep); color:#F3EAD3; border-radius:10px; }
.admin-panel-title{ font-size:12px; font-weight:700; }
.admin-panel-note{ font-size:11px; color:#CFC5A8; margin-top:3px; }
.admin-panel-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.admin-tool{ border:1px solid var(--goldlight); background:transparent; color:#F3EAD3; border-radius:7px; padding:7px 10px; font-size:11px; font-weight:700; cursor:pointer; }
.admin-tool:hover{ background:rgba(216,184,118,0.14); }
.dashboard-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px; margin-top:12px; }
.dashboard-title{ font-family:'Playfair Display', serif; font-size:18px; color:#F3EAD3; }
.dashboard-status{ display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
.dashboard-status span{ font-size:11px; color:#F3EAD3; border:1px solid rgba(216,184,118,0.55); border-radius:999px; padding:5px 9px; }

.stats{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:10px;
  padding:18px 20px 4px 20px; max-width:1000px; margin:0 auto;
}
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
}
.stat .num{ font-family:'Playfair Display', serif; font-size:24px; font-weight:700; color:var(--deep); line-height:1; }
.stat .lbl{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-top:4px; }

.filters{
  max-width:1000px; margin:14px auto 0 auto; padding:0 20px; display:flex; gap:8px; flex-wrap:wrap;
}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:12.5px;
  padding:7px 14px; border-radius:20px; cursor:pointer; font-weight:500;
}
.chip.active{ background:var(--deep); color:#F3EAD3; border-color:var(--deep); }
.type-filter{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.type-filter label{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.type-filter select{ border:1px solid var(--line); background:var(--card); color:var(--ink); font:500 12.5px 'Inter', sans-serif; padding:7px 30px 7px 10px; border-radius:8px; cursor:pointer; }
@media (max-width:600px){ .type-filter{ width:100%; margin-left:0; } .type-filter select{ flex:1; } }

.grid{
  max-width:1000px; margin:16px auto 0 auto; padding:0 20px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px;
}
.category-block{ margin-top:12px; }
.category-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 10px 0;
  padding:0 2px;
}
.category-name{
  font-size:11px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);
}
.category-count{
  font-size:11px; font-weight:700; color:var(--deep); background:#F0E9D9; border:1px solid var(--line); border-radius:999px;
  padding:4px 8px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  display:flex; flex-direction:column; gap:8px;
}
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.card-ref{ font-size:10px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
.card-title{ font-family:'Playfair Display', serif; font-size:19px; font-weight:700; color:var(--deep); margin-top:2px; }
.card-zone{ font-family:'Playfair Display', serif; font-style:italic; font-size:13px; color:var(--clay); }

.photo-card{
  width:100%; height:160px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#F2EFE7;
  display:flex; align-items:center; justify-content:center; position:relative;
}
.photo-card img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-placeholder{
  color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:0.8px; font-weight:600;
}

.badge{
  font-size:10px; font-weight:700; letter-spacing:0.5px; padding:4px 10px; border-radius:14px;
  text-transform:uppercase; white-space:nowrap;
}
.badge-type{ background:var(--gold); color:#1c1804; }

.badges-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }

.card-tagline{ font-size:12.5px; font-style:italic; color:#5b5648; line-height:1.4; }

.specs{ display:flex; gap:14px; border-top:1px solid var(--line); padding-top:10px; margin-top:4px; flex-wrap:wrap; }
.spec .k{ font-size:9.5px; text-transform:uppercase; color:var(--muted); letter-spacing:0.5px; }
.spec .v{ font-family:'Playfair Display', serif; font-size:14px; font-weight:600; color:var(--ink); }

.card-actions{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.contact-actions,.admin-actions{ display:flex; gap:8px; width:100%; }
.admin-actions{ display:grid; grid-template-columns:1fr; border-left:0; border-top:1px solid var(--line); padding:8px 0 0; }
.btn-sm{
  flex:1; min-width:0; padding:8px 6px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--line);
  background:#fff; color:var(--ink); overflow-wrap:anywhere; text-align:center;
}
.btn-sm.edit{ background:var(--deep); color:#F3EAD3; border-color:var(--deep); }
.btn-sm.del{ color:#9C2B22; }
.admin-actions .btn-sm{ width:100%; min-height:34px; white-space:nowrap; font-size:12px; padding-left:8px; padding-right:8px; }
.btn-contact{ background:#F3EAD3; color:var(--deep); border-color:var(--goldlight); text-decoration:none; text-align:center; }
@media (max-width:380px){ .contact-actions{ flex-direction:column; } }

.empty{ text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }

/* Modal */
.overlay{
  display:none; position:fixed; inset:0; background:rgba(15,20,18,0.55); z-index:50;
  align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto;
}
.overlay.open{ display:flex; }
.modal{
  background:#fff; border-radius:14px; max-width:440px; width:100%; padding:22px 22px 18px 22px; margin-top:20px;
}
.modal h2{ font-family:'Playfair Display', serif; font-size:20px; color:var(--deep); margin:0 0 14px 0; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; }
.field input, .field select, .field textarea{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px;
  font-family:'Inter', sans-serif; background:#FAF8F1; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:52px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.toggle-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.toggle-row input{ width:16px; height:16px; }
.toggle-row label{ font-size:13px; color:var(--ink); font-weight:500; }
.status-options{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:7px; }
.status-options label{ display:flex; align-items:center; gap:7px; padding:8px 9px; border:1px solid var(--line); border-radius:8px; background:#FAF8F1; color:var(--ink); font-size:12px; cursor:pointer; }
.status-options input{ accent-color:var(--deep); }

.photo-upload-box{
  border:1px dashed var(--line); border-radius:10px; background:#FAF8F1; padding:10px;
}
.photo-preview{
  display:none; width:100%; height:180px; object-fit:cover; border-radius:8px; margin-top:8px; border:1px solid var(--line);
}
.photo-preview.show{ display:block; }
.btn-upload{
  width:100%; padding:10px 12px; border:none; border-radius:8px; background:var(--deep); color:#F3EAD3; cursor:pointer; font-weight:700;
}
.file-input{ display:none; }

.modal-actions{ display:flex; gap:10px; margin-top:6px; }
.modal-actions button{ flex:1; padding:11px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; border:none; }
.btn-cancel{ background:#EFEAE0; color:var(--ink); }
.btn-save{ background:var(--deep); color:#F3EAD3; }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--deep); color:#F3EAD3; padding:10px 20px; border-radius:24px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:100;
}
.toast.show{ opacity:1; }

.loading{ text-align:center; padding:60px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="seal">W&amp;F</div>
    <div>
      <div class="brand-title">WAGUE <b>&amp;</b> FRÈRES IMMO</div>
      <div class="brand-sub">Patrimoine immobilier</div>
    </div>
  </div>
  <h1>Plateforme de suivi</h1>
  
  <div id="adminControls">
    <button class="addbtn" onclick="openForm()">+ &nbsp;Ajouter un bien</button>
  </div>
  <button class="adminbtn" id="authButton" onclick="toggleAdmin()">Connexion administrateur</button>
  <div class="admin-state" id="adminState">Visiteur : consultation uniquement</div>
  
  
</header>

<div class="filters" id="filters"></div>
<div class="admin-panel" id="adminPanel"></div>
<div class="grid" id="grid"><div class="loading">Chargement…</div></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Ajouter un bien</h2>
    <div class="field">
      <label>Type de bien</label>
      <select id="f_type">
        <option>Villa</option>
        <option>Villa/Immeuble</option>
        <option>Terrain</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Ville</label><input id="f_ville" placeholder="Ex : Dakar"></div>
      <div class="field"><label>Quartier / Zone</label><input id="f_zone" placeholder="Ex : Zac Mbao"></div>
    </div>
    <div class="field">
      <label>Accroche (optionnel)</label>
      <input id="f_tagline" placeholder="Une phrase courte et évocatrice">
    </div>
    <div class="field-row">
      <div class="field"><label>Superficie</label><input id="f_superficie" placeholder="Ex : 300 m²"></div>
      <div class="field"><label>Prix</label><input id="f_prix" placeholder="Ex : 45 000 000 FCFA"></div>
    </div>
    <div class="field">
      <label>Statut</label>
      <div class="status-options" id="f_statut">
        <label><input type="radio" name="statut" value="Disponible"> Disponible</label>
        <label><input type="radio" name="statut" value="Vendu"> Vendu</label>
        <label><input type="radio" name="statut" value="Suspendu"> Suspendu</label>
        <label><input type="radio" name="statut" value="À rénover"> À rénover</label>
        <label><input type="radio" name="statut" value="Réservé"> Réservé</label>
        <label><input type="radio" name="statut" value="Loué"> Loué</label>
      </div>
    </div>
    <div class="field">
      <label>Photo du bien</label>
      <div class="photo-upload-box">
        <input class="file-input" type="file" id="f_photo_upload" accept="image/*">
        <button type="button" class="btn-upload" onclick="document.getElementById('f_photo_upload').click()">Télécharger une photo</button>
        <img id="photoPreview" class="photo-preview" alt="Aperçu de la photo" />
      </div>
    </div>
    <div class="field">
      <label>Notes / description</label>
      <textarea id="f_desc" placeholder="Détails, contexte, remarques..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeForm()">Annuler</button>
      <button class="btn-save" onclick="saveForm()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="overlay" id="loginOverlay">
  <div class="modal">
    <h2>Connexion administrateur</h2>
    <div class="field">
      <label for="adminPassword">Mot de passe</label>
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Mot de passe administrateur">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLogin()">Annuler</button>
      <button class="btn-save" onclick="loginAdmin()">Se connecter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="dataImport" accept="application/json" hidden>

<script>
const STORAGE_KEY = 'wague-properties-v1';
const ADMIN_SESSION_KEY = 'wague-admin-session-v1';
const ADMIN_PASSWORD = 'WagueAdmin2026!';
let properties = [];
let editingId = null;
let activeFilter = 'Tous';
let activeTypeFilter = 'Tous';
let currentPhoto = '';
let isAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY) === 'true';

function safeReadStorage(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function safeWriteStorage(value){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

function fallbackPhotoSrc(src){
  const defaultImage = './PHOTOS%20IMMOBILIER/WG-001/photo1.webp';
  if (!src || !src.trim()) return defaultImage;

  const normalized = src.trim();
  if (normalized.startsWith('data:')) return normalized;
  return normalized;
}

const DEFAULTS = [
  { id: 'V-01', type: 'Villa', ville: 'Dakar', zone: 'Zac Mbao', tagline: 'Le calme de la banlieue, la capitale à portée de main.', superficie: '', prix: '', statut: 'À définir', photos: true, photo: './PHOTOS%20IMMOBILIER/WG-001/photo1.webp', desc: '' },
  { id: 'V-02', type: 'Villa', ville: 'Dakar', zone: 'Diamniadio', tagline: 'Diamniadio, investissez au cœur du Dakar de demain.', superficie: '', prix: '', statut: 'À définir', photos: true, photo: './PHOTOS%20IMMOBILIER/WG-001/photo2.avif', desc: '' },
  { id: 'V-03', type: 'Villa/Immeuble', ville: 'Bignona', zone: 'TP — bien n°1', tagline: "L'âme de la Casamance à portée de main.", superficie: '', prix: '', statut: 'À définir', photos: true, photo: './PHOTOS%20IMMOBILIER/WG-001/photo3.jpg', desc: '' },
  { id: 'V-04', type: 'Villa/Immeuble', ville: 'Bignona', zone: 'TP — bien n°2', tagline: 'Un second bien, la même promesse de qualité.', superficie: '', prix: '', statut: 'À définir', photos: true, photo: './PHOTOS%20IMMOBILIER/WG-001/photo1.webp', desc: '' },
  { id: 'V-05', type: 'Villa', ville: 'Ziguinchor', zone: 'Castor', tagline: 'Le charme intemporel de Ziguinchor.', superficie: '', prix: '', statut: 'À définir', photos: true, photo: './PHOTOS%20IMMOBILIER/WG-001/photo2.avif', desc: '' },
  { id: 'V-06', type: 'Villa', ville: 'Mbour', zone: 'Saly', tagline: "Réveillez-vous face à l'océan, à Saly.", superficie: '', prix: '', statut: 'À définir', photos: true, photo: './PHOTOS%20IMMOBILIER/WG-001/photo3.jpg', desc: '' },
  { id: 'T-01', type: 'Terrain', ville: 'Mbour', zone: 'Saly', tagline: "Un terrain d'exception sur la Petite Côte.", superficie: '', prix: '', statut: 'Disponible', photo: './PHOTOS%20IMMOBILIER/WG-T001/photo1.webp', desc: '' },
  { id: 'T-02', type: 'Terrain', ville: 'Ziguinchor', zone: 'Zone à préciser', tagline: 'La Casamance vous tend les bras.', superficie: '', prix: '', statut: 'Disponible', photo: './PHOTOS%20IMMOBILIER/WG-T002/photo2.jpg', desc: '' },
  { id: 'T-03', type: 'Terrain', ville: 'Bignona', zone: 'Zone à préciser', tagline: 'Un terrain, mille possibilités à Bignona.', superficie: '', prix: '', statut: 'Disponible', photo: './PHOTOS%20IMMOBILIER/WG-T003/photo3.webp', desc: '' },
];

async function loadProperties(){
  try{
    const stored = safeReadStorage();
    properties = Array.isArray(stored) ? stored : DEFAULTS;
    properties = properties.map(property => {
      const updated = { ...property };
      if (updated.id === 'T-01') updated.photo = './PHOTOS%20IMMOBILIER/WG-T001/photo1.webp';
      if (updated.id === 'T-02') updated.photo = './PHOTOS%20IMMOBILIER/WG-T002/photo2.jpg';
      if (updated.id === 'T-03') updated.photo = './PHOTOS%20IMMOBILIER/WG-T003/photo3.webp';
      if (updated.statut === 'À définir') updated.statut = 'Disponible';
      delete updated.photos;
      return updated;
    });
    safeWriteStorage(properties);
    if(!Array.isArray(properties) || properties.length===0){
      properties = DEFAULTS;
      safeWriteStorage(properties);
    }
  }catch(e){
    properties = DEFAULTS;
    safeWriteStorage(properties);
  }
  render();
}

async function persist(){
  const ok = safeWriteStorage(properties);
  if(!ok){
    showToast("Erreur de sauvegarde — réessaie");
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function statutClasses(s){
  switch(s){
    case 'Disponible': return ['ok-bg','ok-tx'];
    case 'Réservé': return ['warn-bg','warn-tx'];
    case 'Suspendu': return ['red-bg','red-tx'];
    case 'À rénover': return ['yellow-bg','yellow-tx'];
    case 'Vendu': case 'Loué': return ['grey-bg','grey-tx'];
    default: return ['yellow-bg','yellow-tx'];
  }
}

function renderStats(){
  const total = properties.length;
  const villas = properties.filter(p=>p.type==='Villa').length;
  const immeubles = properties.filter(p=>p.type==='Villa/Immeuble').length;
  const terrains = properties.filter(p=>p.type==='Terrain').length;
  const statuses = ['Disponible','Vendu','Suspendu','À rénover','Réservé','Loué'];
  const stats = document.getElementById('dashboardStats');
  const statusStats = document.getElementById('dashboardStatus');
  if(!stats || !statusStats) return;
  stats.innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Biens au total</div></div>
    <div class="stat"><div class="num">${villas}</div><div class="lbl">Villas</div></div>
    <div class="stat"><div class="num">${immeubles}</div><div class="lbl">Immeubles</div></div>
    <div class="stat"><div class="num">${terrains}</div><div class="lbl">Terrains</div></div>
  `;
  statusStats.innerHTML = statuses
    .map(status => `<span>${status} : ${properties.filter(p=>p.statut===status).length}</span>`)
    .join('');
}

function renderFilters(){
  const cities = ['Tous', ...new Set(properties.map(p => p.ville))];
  document.getElementById('filters').innerHTML = `
    ${cities.map(c =>
      `<div class="chip ${c===activeFilter?'active':''}" onclick="setFilter('${c.replace(/'/g,"\\'") }')">${c}</div>`
    ).join('')}
    <div class="type-filter">
      <label for="typeFilter">Type</label>
      <select id="typeFilter" onchange="setTypeFilter(this.value)">
        <option value="Tous" ${activeTypeFilter==='Tous'?'selected':''}>Tous les biens</option>
        <option value="Villa" ${activeTypeFilter==='Villa'?'selected':''}>Villas</option>
        <option value="Villa/Immeuble" ${activeTypeFilter==='Villa/Immeuble'?'selected':''}>Immeubles</option>
        <option value="Terrain" ${activeTypeFilter==='Terrain'?'selected':''}>Terrains</option>
      </select>
    </div>
  `;
}

function setFilter(c){ activeFilter = c; render(); }
function setTypeFilter(type){ activeTypeFilter = type; render(); }

function renderGrid(){
  const list = properties.filter(p =>
    (activeFilter === 'Tous' || p.ville === activeFilter) &&
    (activeTypeFilter === 'Tous' || p.type === activeTypeFilter)
  );
  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty">Aucun bien ne correspond à ces filtres.</div>`;
    return;
  }

  const grouped = [
    { key: 'Villa', title: 'Villas' },
    { key: 'Villa/Immeuble', title: 'Immeubles' },
    { key: 'Terrain', title: 'Terrains' }
  ].map(group => ({
    ...group,
    items: list.filter(p => p.type === group.key)
  })).filter(group => group.items.length > 0);

  if(grouped.length === 0){
    grid.innerHTML = `<div class="empty">Aucun bien ne correspond à ces filtres.</div>`;
    return;
  }

  grid.innerHTML = grouped.map(group => `
    <div class="category-block">
      <div class="category-header">
        <div class="category-name">${group.title}</div>
        <div class="category-count">${group.items.length}</div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px;">
        ${group.items.map(p => {
          const [bg, tx] = statutClasses(p.statut);
          const photoSrc = fallbackPhotoSrc(p.photo);
          const hasPhoto = !!(photoSrc && photoSrc.length > 0);
          return `
            <div class="card">
              <div class="photo-card">
                ${hasPhoto ? `<img src="${photoSrc}" alt="${p.ville} ${p.zone}" onerror="this.onerror=null;this.src='./PHOTOS%20IMMOBILIER/WG-001/photo1.webp';">` : '<div class="photo-placeholder">Aucune photo</div>'}
              </div>
              <div class="card-top">
                <div>
                  <div class="card-ref">Dossier ${p.id}</div>
                  <div class="card-title">${p.ville}</div>
                  <div class="card-zone">${p.zone}</div>
                </div>
                <span class="badge badge-type">${p.type}</span>
              </div>
              <div class="badges-row">
                <span class="badge" style="background:var(--${bg});color:var(--${tx})">${p.statut}</span>
              </div>
              ${p.tagline ? `<div class="card-tagline">« ${p.tagline} »</div>` : ''}
              <div class="specs">
                <div class="spec"><div class="k">Superficie</div><div class="v">${p.superficie || '—'}</div></div>
                <div class="spec"><div class="k">Prix</div><div class="v">${p.prix || 'Sur demande'}</div></div>
              </div>
              <div class="card-actions">
                ${!isAdmin ? `<div class="contact-actions">
                  <a class="btn-sm btn-contact" href="mailto:waguepabi@gmail.com?subject=Demande%20d'information%20-%20${encodeURIComponent(p.id)}">Email</a>
                  <a class="btn-sm btn-contact" target="_blank" rel="noopener" href="https://wa.me/221773615128?text=${encodeURIComponent(`Bonjour, je suis intéressé par le bien ${p.id} à ${p.ville}, ${p.zone}.`)}">WhatsApp</a>
                </div>` : ''}
                ${isAdmin ? `<div class="admin-actions"><button class="btn-sm edit" onclick="openForm('${p.id}')">Modifier</button><button class="btn-sm del" title="Supprimer ce bien" onclick="deleteProperty('${p.id}')">Supprimer</button></div>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function render(){
  document.getElementById('adminControls').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('adminPanel').innerHTML = isAdmin ? `
    <div class="admin-panel-inner">
      <div style="width:100%">
        <div class="dashboard-title">Tableau de bord administrateur</div>
        <div class="admin-panel-note">Les données sont enregistrées dans ce navigateur.</div>
        <div class="dashboard-stats" id="dashboardStats"></div>
        <div class="dashboard-status" id="dashboardStatus"></div>
      </div>
      <div class="admin-panel-actions"><button class="admin-tool" onclick="exportData()">Exporter</button><button class="admin-tool" onclick="document.getElementById('dataImport').click()">Importer</button></div>
    </div>` : '';
  document.getElementById('authButton').textContent = isAdmin ? 'Se déconnecter' : 'Connexion administrateur';
  document.getElementById('adminState').textContent = isAdmin ? 'Administrateur connecté' : 'Visiteur : consultation uniquement';
  renderStats();

  renderFilters();
  renderGrid();
}

function exportData(){
  const columns = [
    ['ID', 'id'],
    ['Type', 'type'],
    ['Ville', 'ville'],
    ['Zone', 'zone'],
    ['Statut', 'statut'],
    ['Superficie', 'superficie'],
    ['Prix', 'prix'],
    ['Description', 'desc'],
    ['Chemin photo', 'photo']
  ];
  const escapeHtml = value => String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  const tableHead = columns.map(([label]) => `<th>${escapeHtml(label)}</th>`).join('');
  const tableRows = properties.map(property => `
    <tr>${columns.map(([, key]) => `<td>${escapeHtml(property[key])}</td>`).join('')}</tr>
  `).join('');
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Biens Wague & Frères Immo</title>
    <style>body{font-family:Arial,sans-serif;color:#211D17;padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.seal{width:48px;height:48px;border:2px solid #B4863C;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#B4863C;font-family:Georgia,serif;font-style:italic;font-weight:bold}.brand h1{color:#0F332F;font-family:Georgia,serif;margin:0}.brand small{display:block;color:#B4863C;letter-spacing:2px;margin-top:3px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #D8CBAE;padding:9px;text-align:left;vertical-align:top}th{background:#0F332F;color:white}tr:nth-child(even){background:#F6EFDD}</style>
    </head><body><div class="brand"><div class="seal">W&amp;F</div><div><h1>WAGUE &amp; FRÈRES IMMO</h1><small>Patrimoine immobilier</small></div></div><table><thead><tr>${tableHead}</tr></thead><tbody>${tableRows}</tbody></table></body></html>`;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'wague-freres-biens.html';
  link.click();
  URL.revokeObjectURL(url);
  showToast('Tableau exporté');
}

function importData(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(){
    try{
      const imported = JSON.parse(reader.result);
      if(!Array.isArray(imported)) throw new Error('Format invalide');
      properties = imported;
      await persist();
      render();
      showToast('Données importées');
    }catch(e){
      showToast('Fichier JSON invalide');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function toggleAdmin(){
  if(isAdmin){
    isAdmin = false;
    sessionStorage.removeItem(ADMIN_SESSION_KEY);
    render();
    showToast('Déconnexion réussie');
    return;
  }
  document.getElementById('adminPassword').value = '';
  document.getElementById('loginOverlay').classList.add('open');
  document.getElementById('adminPassword').focus();
}

function closeLogin(){
  document.getElementById('loginOverlay').classList.remove('open');
}

function loginAdmin(){
  const password = document.getElementById('adminPassword').value;
  if(password !== ADMIN_PASSWORD){
    showToast('Mot de passe incorrect');
    return;
  }
  isAdmin = true;
  sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
  closeLogin();
  render();
  showToast('Connexion réussie');
}

function setPhotoPreview(dataUrl){
  const preview = document.getElementById('photoPreview');
  currentPhoto = dataUrl || '';
  preview.src = currentPhoto;
  preview.classList.toggle('show', !!currentPhoto);
}

function handlePhotoUpload(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    setPhotoPreview(e.target.result);
  };
  reader.readAsDataURL(file);
}

function setStatus(value){
  const status = value === 'À définir' ? 'Disponible' : value;
  const radio = document.querySelector(`input[name="statut"][value="${status}"]`);
  if(radio) radio.checked = true;
}

function openForm(id){
  if(!isAdmin) return;
  editingId = id || null;
  const p = id ? properties.find(x=>x.id===id) : null;
  document.getElementById('modalTitle').textContent = p ? `Modifier — ${p.ville}, ${p.zone}` : 'Ajouter un bien';
  document.getElementById('f_type').value = p ? p.type : 'Villa';
  document.getElementById('f_ville').value = p ? p.ville : '';
  document.getElementById('f_zone').value = p ? p.zone : '';
  document.getElementById('f_tagline').value = p ? p.tagline : '';
  document.getElementById('f_superficie').value = p ? p.superficie : '';
  document.getElementById('f_prix').value = p ? p.prix : '';
  setStatus(p ? p.statut : 'Disponible');
  document.getElementById('f_desc').value = p ? (p.desc||'') : '';
  setPhotoPreview(p ? (p.photo || '') : '');
  document.getElementById('f_photo_upload').value = '';
  document.getElementById('overlay').classList.add('open');
}

function closeForm(){
  currentPhoto = '';
  setPhotoPreview('');
  document.getElementById('f_photo_upload').value = '';
  document.getElementById('overlay').classList.remove('open');
}

async function saveForm(){
  if(!isAdmin) return;
  const ville = document.getElementById('f_ville').value.trim();
  const zone = document.getElementById('f_zone').value.trim();
  if(!ville || !zone){
    showToast("Renseigne au moins la ville et la zone");
    return;
  }
  const data = {
    type: document.getElementById('f_type').value,
    ville, zone,
    tagline: document.getElementById('f_tagline').value.trim(),
    superficie: document.getElementById('f_superficie').value.trim(),
    prix: document.getElementById('f_prix').value.trim(),
    statut: document.querySelector('input[name="statut"]:checked')?.value || 'Disponible',
    photo: currentPhoto,
    desc: document.getElementById('f_desc').value.trim(),
  };

  if(editingId){
    const idx = properties.findIndex(p=>p.id===editingId);
    properties[idx] = { ...properties[idx], ...data };
  } else {
    const prefix = data.type === 'Terrain' ? 'T' : 'V';
    const count = properties.filter(p=>p.id.startsWith(prefix)).length + 1;
    const id = `${prefix}-${String(count).padStart(2,'0')}`;
    properties.push({ id, ...data });
  }
  await persist();
  closeForm();
  render();
  showToast("Enregistré");
}

async function deleteProperty(id){
  if(!isAdmin) return;
  if(!confirm("Supprimer ce bien ? Cette action est définitive.")) return;
  properties = properties.filter(p=>p.id!==id);
  await persist();
  render();
  showToast("Bien supprimé");
}

document.getElementById('f_photo_upload').addEventListener('change', handlePhotoUpload);
document.getElementById('dataImport').addEventListener('change', importData);
loadProperties();
</script>
</body>
</html>
